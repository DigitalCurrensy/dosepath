[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "dosepath"
version = "0.1.0"
description = "Lowest-dose eight-neighbor walk. Over the cap, or out of time, is stay."
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Digital Currensy Inc."}]
[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
dosepath = "dosepath.__main__:main"
