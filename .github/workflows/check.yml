name: check
on:
  push:
  pull_request:
  schedule:
    - cron: "21 15 * * *"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a private key or a token
        run: bash .githooks/pre-commit --ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .
      - name: Kernel tests
        run: python -m unittest tests.test_kernel
      - name: Example
        run: python -m dosepath examples/edges.csv --start 0,0 --goal 1,0 --t0 0 --tmax 5 --dose-cap 10
